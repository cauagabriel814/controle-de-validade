server {
  listen 80;
  server_name _;
  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;

  # Fotos chegam reduzidas pelo navegador; a API ainda limita em 5 MB por foto
  client_max_body_size 12m;

  # ---- Cabeçalhos de segurança das telas ----
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(self), geolocation=(), microphone=()" always;

  # ---- API: repassa para o container da API ----
  location /api/ {
    proxy_pass http://api:3000;
    # $http_host mantém a porta: a API compara com o Origin (proteção CSRF)
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  location ~* \.(css|js)$ {
    expires 1h;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
